name: ROM Dumper v2

on:
  workflow_dispatch:
    inputs:
      link:
        description: 'Firmware Link'
        required: true
      device:
        description: 'Device codename (e.g. cancunf)'
        required: true
        default: 'cancunf'
      upload_build_prop:
        description: 'Upload vendor build.prop'
        type: boolean
        required: false
        default: true
      upload_system_build_prop:
        description: 'Upload system build.prop'
        type: boolean
        required: false
        default: true
      upload_system_ext_build_prop:
        description: 'Upload system_ext build.prop'
        type: boolean
        required: false
        default: true
      upload_selinux:
        description: 'Upload SELinux policies (all partitions)'
        type: boolean
        required: false
        default: true
      upload_framework:
        description: 'Upload framework.jar'
        type: boolean
        required: false
        default: true
      upload_services:
        description: 'Upload services.jar'
        type: boolean
        required: false
        default: true
      upload_settings:
        description: 'Upload Settings.apk'
        type: boolean
        required: false
        default: true
      upload_odm:
        description: 'Upload ODM partition'
        type: boolean
        required: false
        default: true

env:
  TZ: Asia/Kolkata

jobs:
  Firmware-Dump:
    runs-on: ubuntu-22.04

    steps:
      - name: Sanitize Device Name
        id: vars
        run: |
          SAFE_DEVICE=$(echo "${{ github.event.inputs.device }}" | tr '[:upper:]' '[:lower:]' | tr ' _' '-' | tr -cd 'a-z0-9-')
          echo "safe_device=${SAFE_DEVICE}" >> $GITHUB_OUTPUT
          echo "tag_name=dump-${SAFE_DEVICE}-${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "✅ Sanitized device name: ${SAFE_DEVICE}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup Space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Install DumprX Requirements
        run: |
          bash setup.sh
          # Make uv available for the rest of the workflow — setup.sh installs it
          # to ~/.local/bin but doesn't export the PATH for subsequent steps.
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run DumprX
        run: bash dumper.sh "${{ github.event.inputs.link }}"

      # -----------------------------------------------------------------------
      # dumper.sh writes everything to  <repo-root>/out/
      # Flat layout:   out/vendor/build.prop
      #                out/system/build.prop   (or out/system/system/build.prop
      #                                            on nested-system devices)
      #                out/system_ext/build.prop
      #                out/system/framework/framework.jar
      #                out/odm/  (directory)
      # -----------------------------------------------------------------------

      - name: Debug - Show Dump Structure
        if: always()
        run: |
          echo "=== Top-level out/ structure ==="
          ls -la out/ 2>/dev/null || echo "No out/ directory"
          echo ""
          echo "=== All build.prop files ==="
          find out -name "build.prop" -type f 2>/dev/null || echo "None found"
          echo ""
          echo "=== Looking for Settings*.apk ==="
          find out -iname "Settings*.apk" -type f 2>/dev/null || echo "None found"
          echo ""
          echo "=== Looking for framework.jar / services.jar ==="
          find out -name "framework.jar" -o -name "services.jar" 2>/dev/null || echo "None found"
          echo ""
          echo "=== ODM top-level contents ==="
          ls -la out/odm/ 2>/dev/null || echo "No out/odm/ directory"

      - name: Collect and Package Files
        run: |
          set -euo pipefail
          mkdir -p upload_files
          OUTDIR="out"
          COLLECTED=""

          # ----------------------------------------------------------------
          # safe_copy <src> <dst> <label>
          # Returns 0 on success, 1 if the source is missing or 0-byte.
          # ----------------------------------------------------------------
          safe_copy() {
            local src="$1" dst="$2" label="$3"
            if [[ ! -f "$src" ]]; then
              echo "❌ $label — not found at: $src"
              return 1
            fi
            local sz
            sz=$(stat -c%s "$src" 2>/dev/null || echo 0)
            if [[ "$sz" -eq 0 ]]; then
              echo "⚠️  $label — file is 0 bytes. Skipping."
              return 1
            fi
            cp "$src" "$dst"
            return 0
          }

          # ----------------------------------------------------------------
          # find_file <label> <pattern…>
          # Tries each glob pattern in order; prints the first non-empty hit.
          # ----------------------------------------------------------------
          find_file() {
            local label="$1"; shift
            local result
            for pattern in "$@"; do
              result=$(find "$OUTDIR" -path "$pattern" -type f 2>/dev/null | head -1)
              if [[ -n "$result" ]]; then
                echo "$result"
                return 0
              fi
            done
            echo "❌ $label — not found anywhere" >&2
            return 1
          }

          # ========================
          # 1. VENDOR BUILD.PROP
          # ========================
          if [[ "${{ github.event.inputs.upload_build_prop }}" == "true" ]]; then
            result=$(find_file "vendor/build.prop" \
              "*/vendor/build.prop") && \
            safe_copy "$result" upload_files/vendor_build.prop "vendor/build.prop" && \
            COLLECTED="${COLLECTED}\n- vendor_build.prop ✅" && \
            echo "✅ vendor/build.prop → upload_files/vendor_build.prop" || \
            COLLECTED="${COLLECTED}\n- vendor_build.prop ❌"
          else
            echo "⏭️  Skipping vendor build.prop"
          fi

          # ========================
          # 2. SYSTEM BUILD.PROP
          # ========================
          if [[ "${{ github.event.inputs.upload_system_build_prop }}" == "true" ]]; then
            # Prefer the flat layout (out/system/build.prop); fall back to
            # nested (out/system/system/build.prop) used by some OEMs.
            result=$(find_file "system/build.prop" \
              "*/system/build.prop" \
              "*/system/system/build.prop") && \
            safe_copy "$result" upload_files/system_build.prop "system/build.prop" && \
            COLLECTED="${COLLECTED}\n- system_build.prop ✅ (from: $result)" && \
            echo "✅ system/build.prop → upload_files/system_build.prop" || \
            COLLECTED="${COLLECTED}\n- system_build.prop ❌"
          else
            echo "⏭️  Skipping system build.prop"
          fi

          # ========================
          # 3. SYSTEM_EXT BUILD.PROP
          # ========================
          if [[ "${{ github.event.inputs.upload_system_ext_build_prop }}" == "true" ]]; then
            result=$(find_file "system_ext/build.prop" \
              "*/system_ext/build.prop" \
              "*/system/system_ext/build.prop") && \
            safe_copy "$result" upload_files/system_ext_build.prop "system_ext/build.prop" && \
            COLLECTED="${COLLECTED}\n- system_ext_build.prop ✅ (from: $result)" && \
            echo "✅ system_ext/build.prop → upload_files/system_ext_build.prop" || \
            COLLECTED="${COLLECTED}\n- system_ext_build.prop ❌"
          else
            echo "⏭️  Skipping system_ext build.prop"
          fi

          # ========================
          # 4. SELINUX POLICIES
          # ========================
          if [[ "${{ github.event.inputs.upload_selinux }}" == "true" ]]; then
            rm -rf /tmp/selinux_staging
            mkdir -p /tmp/selinux_staging
            SELINUX_FOUND=false

            for partition in vendor system system_ext product; do
              selinux_dir=$(find "$OUTDIR" -path "*/${partition}/etc/selinux" -type d 2>/dev/null | head -1)
              if [[ -n "$selinux_dir" ]]; then
                dest="/tmp/selinux_staging/${partition}_selinux"
                mkdir -p "$dest"
                rsync -rL --ignore-errors "$selinux_dir/" "$dest/" 2>/dev/null || \
                  cp -rL "$selinux_dir/." "$dest/" 2>/dev/null || true
                if find "$dest" -type f -print -quit 2>/dev/null | grep -q .; then
                  SELINUX_FOUND=true
                  echo "✅ $partition selinux collected"
                else
                  echo "⚠️  $partition selinux dir exists but resolved to no files"
                  rm -rf "$dest"
                fi
              fi
            done

            if [[ "$SELINUX_FOUND" == "true" ]]; then
              ( cd /tmp/selinux_staging && zip -r selinux_all.zip ./* )
              cp /tmp/selinux_staging/selinux_all.zip upload_files/selinux_all.zip
              sz=$(du -h upload_files/selinux_all.zip | cut -f1)
              COLLECTED="${COLLECTED}\n- selinux_all.zip ✅ ($sz)"
              echo "✅ selinux_all.zip created ($sz)"
            else
              echo "❌ No SELinux policies found"
              COLLECTED="${COLLECTED}\n- selinux_all.zip ❌"
            fi
          else
            echo "⏭️  Skipping SELinux"
          fi

          # ========================
          # 5. FRAMEWORK.JAR
          # ========================
          if [[ "${{ github.event.inputs.upload_framework }}" == "true" ]]; then
            result=$(find_file "framework.jar" \
              "*/system/framework/framework.jar" \
              "*/system/system/framework/framework.jar") && \
            safe_copy "$result" upload_files/framework.jar "framework.jar" && \
            sz=$(du -h upload_files/framework.jar | cut -f1) && \
            COLLECTED="${COLLECTED}\n- framework.jar ✅ ($sz)" && \
            echo "✅ framework.jar ($sz)" || \
            COLLECTED="${COLLECTED}\n- framework.jar ❌"
          else
            echo "⏭️  Skipping framework.jar"
          fi

          # ========================
          # 6. SERVICES.JAR
          # ========================
          if [[ "${{ github.event.inputs.upload_services }}" == "true" ]]; then
            result=$(find_file "services.jar" \
              "*/system/framework/services.jar" \
              "*/system/system/framework/services.jar") && \
            safe_copy "$result" upload_files/services.jar "services.jar" && \
            sz=$(du -h upload_files/services.jar | cut -f1) && \
            COLLECTED="${COLLECTED}\n- services.jar ✅ ($sz)" && \
            echo "✅ services.jar ($sz)" || \
            COLLECTED="${COLLECTED}\n- services.jar ❌"
          else
            echo "⏭️  Skipping services.jar"
          fi

          # ========================
          # 7. SETTINGS.APK
          # ========================
          if [[ "${{ github.event.inputs.upload_settings }}" == "true" ]]; then
            SETTINGS_FOUND=false
            for pattern in \
              "*/system/priv-app/Settings/Settings.apk" \
              "*/system/app/Settings/Settings.apk" \
              "*/product/priv-app/Settings/Settings.apk" \
              "*/system/product/priv-app/Settings/Settings.apk" \
              "*/system_ext/priv-app/Settings/Settings.apk" \
              "*/system/priv-app/SettingsGoogle/SettingsGoogle.apk" \
              "*/product/priv-app/SettingsGoogle/SettingsGoogle.apk" \
              "*/system_ext/priv-app/SettingsGoogle/SettingsGoogle.apk"
            do
              result=$(find "$OUTDIR" -path "$pattern" -type f 2>/dev/null | head -1)
              if [[ -n "$result" ]] && safe_copy "$result" upload_files/Settings.apk "Settings.apk"; then
                COLLECTED="${COLLECTED}\n- Settings.apk ✅ (from: $result)"
                echo "✅ Settings.apk from: $result"
                SETTINGS_FOUND=true
                break
              fi
            done
            if [[ "$SETTINGS_FOUND" == "false" ]]; then
              # Last-resort case-insensitive search
              result=$(find "$OUTDIR" -iname "settings.apk" -type f 2>/dev/null | head -1)
              if [[ -n "$result" ]] && safe_copy "$result" upload_files/Settings.apk "Settings.apk (fallback)"; then
                COLLECTED="${COLLECTED}\n- Settings.apk ✅ (fallback: $result)"
                echo "✅ Settings.apk (fallback) from: $result"
                SETTINGS_FOUND=true
              fi
            fi
            if [[ "$SETTINGS_FOUND" == "false" ]]; then
              echo "❌ Settings.apk not found"
              COLLECTED="${COLLECTED}\n- Settings.apk ❌"
            fi
          else
            echo "⏭️  Skipping Settings.apk"
          fi

          # ========================
          # 8. ODM PARTITION
          # ========================
          if [[ "${{ github.event.inputs.upload_odm }}" == "true" ]]; then
            rm -rf /tmp/odm_staging
            mkdir -p /tmp/odm_staging
            ODM_DIR=$(find "$OUTDIR" -maxdepth 3 -name "odm" -type d 2>/dev/null | head -1)

            if [[ -n "$ODM_DIR" ]]; then
              rsync -rL --ignore-errors "$ODM_DIR/" /tmp/odm_staging/ 2>/dev/null || \
                cp -rL "$ODM_DIR/." /tmp/odm_staging/ 2>/dev/null || true
              FILE_COUNT=$(find /tmp/odm_staging -type f 2>/dev/null | wc -l)
              if [[ "$FILE_COUNT" -gt 0 ]]; then
                ( cd /tmp/odm_staging && zip -r odm.zip . > /dev/null 2>&1 )
                cp /tmp/odm_staging/odm.zip upload_files/odm.zip
                sz=$(du -h upload_files/odm.zip | cut -f1)
                COLLECTED="${COLLECTED}\n- odm.zip ✅ ($FILE_COUNT files, $sz)"
                echo "✅ odm.zip created ($FILE_COUNT files, $sz)"
              else
                echo "❌ ODM directory resolved to zero files"
                COLLECTED="${COLLECTED}\n- odm.zip ❌ empty"
              fi
            else
              echo "❌ ODM directory not found"
              COLLECTED="${COLLECTED}\n- odm.zip ❌ not found"
            fi
          else
            echo "⏭️  Skipping ODM"
          fi

          # ========================
          # FINAL SUMMARY
          # ========================
          echo ""
          echo "========================================="
          echo "          COLLECTION SUMMARY"
          echo "========================================="
          echo -e "$COLLECTED"
          echo "========================================="
          echo ""
          ls -lh upload_files/ || true

          FILE_COUNT=$(find upload_files -maxdepth 1 -type f 2>/dev/null | wc -l)
          echo "Total files ready for upload: $FILE_COUNT"
          if [[ "$FILE_COUNT" -eq 0 ]]; then
            echo "❌ No files collected — check the dump output above."
            exit 1
          fi
          echo "✅ Ready to upload $FILE_COUNT file(s)"

      - name: Print Build Props
        if: always()
        run: |
          echo "========================================="
          echo "          BUILD PROP CONTENTS"
          echo "========================================="
          for label in vendor_build.prop system_build.prop system_ext_build.prop; do
            path="upload_files/${label}"
            if [[ -f "$path" ]]; then
              echo ""
              echo "───────────────────────────────────────"
              echo "  📄 ${label}"
              echo "───────────────────────────────────────"
              cat "$path"
            fi
          done
          echo ""
          echo "========================================="

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: "${{ github.event.inputs.device }} Firmware Dump"
          body: |
            ## 📱 ${{ github.event.inputs.device }} Firmware Dump

            **Firmware:** `${{ github.event.inputs.link }}`
            **Run:** #${{ github.run_number }}

            ### Selected Uploads
            - Vendor build.prop: ${{ github.event.inputs.upload_build_prop }}
            - System build.prop: ${{ github.event.inputs.upload_system_build_prop }}
            - System_ext build.prop: ${{ github.event.inputs.upload_system_ext_build_prop }}
            - SELinux: ${{ github.event.inputs.upload_selinux }}
            - framework.jar: ${{ github.event.inputs.upload_framework }}
            - services.jar: ${{ github.event.inputs.upload_services }}
            - Settings.apk: ${{ github.event.inputs.upload_settings }}
            - ODM: ${{ github.event.inputs.upload_odm }}

            > Auto-generated by ROM Dumper
          files: upload_files/*
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
