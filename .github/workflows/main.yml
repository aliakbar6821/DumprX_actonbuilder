name: ROM Dumper urgent

on:
  workflow_dispatch:
    inputs:
      link:
        description: 'Firmware Link'
        required: true
      device:
        description: 'Device codename (e.g. cancunf)'
        required: true
        default: 'cancunf'

env:
  LINK: ${{ github.event.inputs.link }}
  TZ: Asia/Kolkata

jobs:
  Firmware-Dump:
    runs-on: ubuntu-22.04

    steps:
      - name: Prepare Variables (Sanitize Device Name)
        id: vars
        run: |
          SAFE_DEVICE=$(echo "${{ github.event.inputs.device }}" | tr '[:upper:]' '[:lower:]' | tr ' _' '-' | tr -cd 'a-z0-9-')
          echo "safe_device=${SAFE_DEVICE}" >> $GITHUB_OUTPUT
          echo "release_name=${{ github.event.inputs.device }} Vendor Dump" >> $GITHUB_OUTPUT
          echo "tag_name=dump-${SAFE_DEVICE}-${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "Using safe device name: ${SAFE_DEVICE}"

      - name: Download ROM First
        run: |
          aria2c -x16 -s16 -k1M --check-certificate=false -o rom.zip "$LINK"
          ls -lh rom.zip

      - name: Cleanup Space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Clone DumprX
        run: |
          git clone https://github.com/sarthakroy2002/DumprX --depth=1

      - name: Install DumprX Requirements
        run: |
          cd DumprX
          bash setup.sh

      - name: Run DumprX
        run: |
          cd DumprX
          mv ../rom.zip .
          bash dumper.sh rom.zip

      - name: Collect Files
        run: |
          mkdir -p release_files
          SEARCH_DIR="DumprX/out"

          # === Existing collections (vendor/build.prop, selinux, odm) ===
          result=$(find $SEARCH_DIR -path "*/vendor/build.prop" 2>/dev/null | head -1)
          if [ -n "$result" ]; then
            cp "$result" release_files/vendor_build.prop
            echo "✅ Found vendor/build.prop"
          fi

          for selinux in vendor system system_ext product; do
            result=$(find $SEARCH_DIR -path "*/${selinux}/etc/selinux" -type d 2>/dev/null | head -1)
            if [ -n "$result" ]; then
              mkdir -p release_files/${selinux}_selinux
              cp -r "$result"/. release_files/${selinux}_selinux/
              echo "✅ Found ${selinux} selinux"
            fi
          done

          # ODM
          result=$(find $SEARCH_DIR -path "*/vendor/odm" -type d 2>/dev/null | head -1)
          if [ -z "$result" ]; then
            result=$(find $SEARCH_DIR -path "*/odm" -type d 2>/dev/null | head -1)
          fi
          if [ -n "$result" ]; then
            mkdir -p release_files/odm
            cp -r "$result"/. release_files/odm/
            echo "✅ Found odm"
          fi

          # === NEW: framework.jar, services.jar, Settings.apk ===
          find $SEARCH_DIR -path "*/system/framework/framework.jar" -type f -exec cp {} release_files/framework.jar \; && echo "✅ Found framework.jar" || echo "❌ framework.jar not found"
          find $SEARCH_DIR -path "*/system/framework/services.jar"  -type f -exec cp {} release_files/services.jar  \; && echo "✅ Found services.jar"  || echo "❌ services.jar not found"

          # Settings.apk (priv-app first, then app)
          result=$(find $SEARCH_DIR -path "*/system/priv-app/Settings/Settings.apk" -type f 2>/dev/null | head -1)
          if [ -z "$result" ]; then
            result=$(find $SEARCH_DIR -path "*/system/app/Settings/Settings.apk" -type f 2>/dev/null | head -1)
          fi
          if [ -n "$result" ]; then
            cp "$result" release_files/Settings.apk
            echo "✅ Found Settings.apk"
          else
            echo "❌ Settings.apk not found"
          fi

          # ===== ZIP CREATION =====
          cd release_files

          SELINUX_DIRS=$(ls -d *_selinux 2>/dev/null || true)
          if [ -n "$SELINUX_DIRS" ]; then
            zip -r selinux_all.zip $SELINUX_DIRS
            echo "✅ Created selinux_all.zip"
          fi

          if [ -d "odm" ] && [ "$(ls -A odm 2>/dev/null)" ]; then
            zip -r odm.zip odm/
            echo "✅ Created odm.zip"
          fi

          cd ..

          echo "=== FINAL FILES ==="
          ls -lh release_files/
          du -h release_files/*

          [ -z "$(ls -A release_files/ 2>/dev/null)" ] && { echo "❌ No files collected!"; exit 1; }

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.release_name }}
          body: |
            **Device:** ${{ github.event.inputs.device }}
            **Firmware:** ${{ github.event.inputs.link }}
            **Run ID:** ${{ github.run_number }}

            Auto-generated by ROM Dumper.
          files: release_files/*
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
